plugins { id 'com.android.application' }

android {
    namespace 'id.rexz.webtoonlite'
    compileSdk 35
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'id.rexz.webtoonlite'
        minSdk 26
        targetSdk 34
        // 64-bit first; armeabi-v7a keeps the APK installable on 32-bit Android builds.
        // CI smoke test passes -Pabis=x86_64 to run the same native code on an emulator.
        ndk { abiFilters(*(project.hasProperty('abis') ? project.property('abis').toString().split(',') : ['arm64-v8a', 'armeabi-v7a'])) }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 5
        versionName '0.5.0-realtime'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    // Model weights barely compress; stored uncompressed they can be memory-mapped by
    // AAssetManager (no 10 MB heap copy while loading on a 4 GB phone).
    androidResources { noCompress 'bin', 'param' }
    // Native libraries stay compressed inside the APK and are extracted at install time.
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Fallback OCR only. Unbundled: the model is downloaded once by Google Play Services.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    // Camera mode (CameraX, back camera only).
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.guava:listenablefuture:1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
