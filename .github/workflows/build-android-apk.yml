name: Build Android APK (Free)

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'upgrade/**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install native build tools
        run: sdkmanager --install 'ndk;30.0.16248370' 'cmake;3.22.1'

      - name: Prepare PP-OCRv5 models and libraries
        run: python3 scripts/prepare_native_ocr.py

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile signed debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Show build errors in the run summary
        if: failure()
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('build.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['build.log missing']
          keep = set()
          for i, l in enumerate(lines):
              if re.search(r'error|FAILED|What went wrong|Caused by|CMake Error|undefined|fatal', l, re.I):
                  keep.update(range(max(0, i - 2), min(len(lines), i + 4)))
          picked = [lines[i] for i in sorted(keep)][:160] + ['--- tail ---'] + lines[-60:]
          msg = '\n'.join(picked)[-30000:]
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle build log::' + msg)
          PY

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > apk-listing.txt
          cat apk-listing.txt | grep -E 'libwebtoonocr.so|PP_OCRv5|classes' || true
          for abi in arm64-v8a armeabi-v7a; do
            grep -q "lib/$abi/libwebtoonocr.so" apk-listing.txt || { echo "missing native lib for $abi"; exit 1; }
          done
          for f in PP_OCRv5_mobile_det.ncnn.param PP_OCRv5_mobile_det.ncnn.bin PP_OCRv5_mobile_rec.ncnn.param PP_OCRv5_mobile_rec.ncnn.bin; do
            grep -q "assets/$f" apk-listing.txt || { echo "missing model asset $f"; exit 1; }
          done
          # Models must be stored uncompressed so they can be memory-mapped.
          unzip -v "$APK" 'assets/*.bin' | awk '/assets/ && $2 != "Stored" {print "compressed asset: " $0; bad=1} END {exit bad}'
          # No Gemini key may ever ship inside the APK or the sources.
          mkdir -p /tmp/apkx && unzip -q -o "$APK" -d /tmp/apkx
          if grep -rIl 'AIza[0-9A-Za-z_-]\{30,\}' /tmp/apkx app .github scripts 2>/dev/null; then echo "API key pattern found"; exit 1; fi
          ls -l "$APK"
          SIZE=$(stat -c %s "$APK")
          LIBS=$(grep -E 'lib/.*/libwebtoonocr.so' apk-listing.txt | awk '{print $1" bytes "$4}' | tr '\n' ';')
          echo "::notice title=APK size::${SIZE} bytes | native libs: ${LIBS}"

      - name: Make downloadable APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/WebtoonLite-debug.apk
          sha256sum artifact/WebtoonLite-debug.apk > artifact/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebtoonLite-Android11-APK
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    # Runs the same native code (assets -> JNI -> ncnn -> PP-OCRv5) on an x86_64 emulator
    # (Android 11 / API 30). Not a speed benchmark for a phone; it proves the pipeline works.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and native build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;30.0.16248370' 'cmake;3.22.1'

      - name: Prepare PP-OCRv5 models and libraries (x86_64)
        run: WEBTOON_ABIS=x86_64 python3 scripts/prepare_native_ocr.py

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native OCR smoke test on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pabis=x86_64 > smoke-gradle.log 2>&1 || true
            adb logcat -d -s WebtoonSmoke:I > smoke.log || true

      - name: Report smoke test result
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          def esc(t): return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          log = pathlib.Path('smoke.log')
          g = pathlib.Path('smoke-gradle.log')
          body = log.read_text(errors='replace') if log.exists() else 'smoke.log missing'
          passed = 'SMOKE RESULT: PASS' in body
          tail = '' if passed or not g.exists() else '\n--- gradle tail ---\n' + '\n'.join(g.read_text(errors='replace').splitlines()[-80:])
          print('::' + ('notice' if passed else 'error') + ' title=Native OCR smoke test::' + esc((body + tail)[-30000:]))
          pathlib.Path('smoke.passed').write_text('1' if passed else '0')
          PY
          test "$(cat smoke.passed)" = "1"
